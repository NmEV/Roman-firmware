name: Build Pico 2 Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动触发

# 默认只读；发布 release 的 job 自己声明 contents: write
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ 拉取项目代码
    - name: Checkout Project
      uses: actions/checkout@v4

    # 2️⃣ 安装基础构建依赖
    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y cmake build-essential git wget xz-utils
    # 3️⃣ 下载并安装 ARM 交叉编译器
    # 显式创建目录并解压，确保 PICO_TOOLCHAIN_PATH 路径可控
    - name: Install ARM GCC Toolchain
      run: |
        wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz
        mkdir -p ${{ github.workspace }}/arm-toolchain
        tar -xJf arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz -C ${{ github.workspace }}/arm-toolchain --strip-components=1
        
        # 设置环境变量供后续 Step 使用
        echo "PICO_TOOLCHAIN_PATH=${{ github.workspace }}/arm-toolchain" >> $GITHUB_ENV
        echo "${{ github.workspace }}/arm-toolchain/bin" >> $GITHUB_PATH
    # 4️⃣ 获取 Pico SDK (版本 2.2.0 以支持 Pico 2)
    - name: Clone Pico SDK
      run: |
        git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk.git
        cd pico-sdk
        git submodule update --init --recursive
        
        # 设置 SDK 绝对路径环境变量
        echo "PICO_SDK_PATH=${{ github.workspace }}/pico-sdk" >> $GITHUB_ENV
    # 5️⃣ 调试信息 (如果再次崩溃，查看此步骤日志)
    - name: Debug Paths
      run: |
        echo "Workspace: ${{ github.workspace }}"
        echo "SDK Path: $PICO_SDK_PATH"
        echo "Toolchain Path: $PICO_TOOLCHAIN_PATH"
        ls -l $PICO_SDK_PATH/pico_sdk_init.cmake
    # 6️⃣ 运行 CMake 并编译
    # 显式传入 PICO_BOARD 和工具链路径
    - name: Build
      run: |
        mkdir -p build
        cd build
        cmake -DPICO_BOARD=pico2 \
              -DCMAKE_BUILD_TYPE=Release \
              -DPICO_TOOLCHAIN_PATH=${{ env.PICO_TOOLCHAIN_PATH }} \
              ..
        make -j$(nproc)
    # 6b) 断言 pico_config.h 真的被注入到生成的配置头里：4 KB 栈与单核 flash
    # 设置都靠它生效，静默失效会变成上板后死机，而不是构建失败
    - name: Verify SDK config injection
      run: |
        HDR=build/generated/pico_base/pico/config_autogen.h
        test -f "$HDR" || { echo "::error::$HDR was not generated"; exit 1; }
        grep -q 'pico_config.h' "$HDR" || {
          echo "::error::pico_config.h was NOT injected - PICO_STACK_SIZE and PICO_FLASH_ASSUME_CORE1_SAFE would silently not apply"; exit 1; }
        echo "pico_config.h is injected into config_autogen.h"
    # 6c) 打印镜像与栈符号：固件自己报告 stack.total/free_min，这里给出构建期
    # 证据（运行期栈在 .bss 里，RAM 吃紧会让链接期断言先失败）
    - name: Report image size and stack symbols
      run: |
        arm-none-eabi-size build/roman.elf
        arm-none-eabi-nm build/roman.elf | grep -Ei 'stack' || true
    # 7️⃣ 上传固件制品
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: roman-firmware
        # 根据 CMakeLists.txt，生成的文件名应为 roman.uf2
        path: |
          build/*.uf2
          build/*.elf
          build/*.bin

  # 8️⃣ 每次推送到 main/master 后，把同一个 tag（latest）的 release 指向这次构建。
  # 固定下载地址：<repo>/releases/download/latest/roman.uf2
  # PR 与 workflow_dispatch 不发布；构建失败时本 job 不会运行。
  release-latest:
    name: Publish fixed 'latest' release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    # 同一个 latest release 不能被两个推送同时改写：排队而不是并发
    concurrency:
      group: release-latest
      cancel-in-progress: false
    # 移动 tag 与创建 release 都需要写权限；默认只读
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 版本号只有一个来源：CMakeLists.txt 的 set(ROMAN_VERSION ...)。发布说明里
    # 带上它，下载的人和 board 上 /info 报的版本就能对上。找不到就报错退出。
    - name: Read firmware version
      id: version
      shell: bash
      run: |
        version=$(sed -n 's/^set(ROMAN_VERSION[[:space:]]*\([^)]*\)).*/\1/p' CMakeLists.txt)
        test -n "$version" || { echo "::error::ROMAN_VERSION not found in CMakeLists.txt"; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "firmware version: $version"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release

    - name: Flatten artifacts
      shell: bash
      run: |
        mkdir -p release-files
        find release -type f -exec cp {} release-files/ \;
        ls -l release-files

    - name: Generate checksums
      shell: bash
      run: |
        cd release-files
        sha256sum * > SHA256SUMS.txt
        cat SHA256SUMS.txt

    - name: Move fixed 'latest' tag
      shell: bash
      run: |
        git tag -f latest "$GITHUB_SHA"
        git push --force origin refs/tags/latest

    - name: Publish fixed 'latest' release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
      shell: bash
      run: |
        # 已有同名 Release 时先删除（tag 上一步已经移到新提交，删除不会丢 tag）
        gh release delete latest --yes >/dev/null 2>&1 || true
        # 说明写进文件再交给 gh，避免在命令行里拼换行
        cat > notes.md <<EOF
        自动构建产物，随 main 分支每次推送更新。

        - firmware version: ${VERSION}
        - commit: ${GITHUB_SHA}
        - built from pico-sdk 2.2.0 + arm-gnu-toolchain 13.2.rel1, PICO_BOARD=pico2

        固定下载地址：
        - https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/roman.uf2
        - https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/SHA256SUMS.txt

        刷写前请核对 SHA256SUMS.txt。
        EOF
        gh release create latest release-files/* \
          --title "Roman ${VERSION} firmware (${GITHUB_SHA:0:7})" \
          --notes-file notes.md
